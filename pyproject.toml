[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrouter-platform"
version = "0.1.0"
description = "Multi-tenant platform for training, serving and operating LLM routers: auth, RBAC, quotas, a Postgres-backed job queue, experiment tracking, a model registry, usage analytics and audit logs."
requires-python = ">=3.10"
dependencies = [
  # The routing algorithms themselves come from this published package.
  "llmrouter-lib==0.4.0",
  "fastapi",
  "uvicorn",
  "httpx",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "email-validator>=2.0",
  "redis>=5.0",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
  "opentelemetry-instrumentation-redis>=0.45b0",
  "opentelemetry-exporter-otlp-proto-http>=1.24",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests with no external dependencies",
    "integration: tests that need the real Postgres and Redis containers",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false

[tool.ruff.lint.per-file-ignores]
# Prompt templates are data; wrapping them would hurt readability.
"scripts/generate_sample_data.py" = ["E501"]
